<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EASYCOINS">
  <!--
    The EASYCOINS mark.

    An E built from three bars whose ends are cut as coin edges, leaning
    forward. Three bars and a spine is a silhouette that survives being drawn at
    sixteen pixels, which a letter inside a circle does not, and the rounded
    terminals tie the letter to the currency without drawing a coin next to it.

    The detached sliver behind the top arm is the same motion cue the product
    artwork uses, so the mark and the packs belong to one system.

    Original artwork. No publisher, game or third-party asset is involved.
  -->
  <defs>
    <linearGradient id="ec-mark" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F4E6C3"/>
      <stop offset="0.5" stop-color="#D4B46A"/>
      <stop offset="1" stop-color="#A9884A"/>
    </linearGradient>
  </defs>
  <g transform="translate(5,0) skewX(-8)" fill="url(#ec-mark)">
    <rect x="14" y="12" width="10" height="40" rx="3"/>
    <rect x="14" y="12" width="34" height="10" rx="5"/>
    <rect x="14" y="27" width="26" height="10" rx="5"/>
    <rect x="14" y="42" width="34" height="10" rx="5"/>
    <rect x="3" y="12" width="7" height="10" rx="5" opacity="0.45"/>
  </g>
</svg>
