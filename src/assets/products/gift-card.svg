<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="כרטיס מתנה">
  <!-- EASYCOINS product art. Machined octagonal tokens, struck with the brand Z
       and cut on the same nine-degree shear as the mark, so every thumbnail in
       the catalogue belongs to one family and matches the artwork the app
       renders inline. Original geometry; no publisher property is depicted. -->
  <defs>
    <linearGradient id="g" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#F4E6C3"/><stop offset="0.42" stop-color="#D4B46A"/>
      <stop offset="0.78" stop-color="#A9884A"/><stop offset="1" stop-color="#E6CB86"/>
    </linearGradient>
    <linearGradient id="e" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9884A"/><stop offset="1" stop-color="#6B5228"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#A8C0FF"/><stop offset="1" stop-color="#2E5FF0"/>
    </linearGradient>
    <radialGradient id="p" cx="50%" cy="74%" r="55%">
      <stop offset="0" stop-color="#D4B46A" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#D4B46A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="100" cy="122" rx="56" ry="20" fill="url(#p)"/>
  <g transform="skewX(-9) translate(9,0)">
    <rect x="42" y="62" width="116" height="60" rx="10" fill="#1F1D1A" stroke="url(#g)" stroke-width="2"/>
    <rect x="56" y="84" width="88" height="14" rx="7" fill="url(#g)"/>
  </g>
</svg>
