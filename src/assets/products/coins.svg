<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="קוינס">
  <!-- EASYCOINS product art: a stack of machined coins struck with the brand's
       E, in the Elite champagne material of the card system. This static file
       is the catalog's product image (cart lines, order pages, admin); the
       storefront draws the same coins live per tier with tt-coin-art.
       Original design; nothing here depicts another company's coin or card. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F7EBCB"/>
      <stop offset="0.45" stop-color="#D4B46A"/>
      <stop offset="0.82" stop-color="#A9884A"/>
      <stop offset="1" stop-color="#6B5228"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9884A"/>
      <stop offset="1" stop-color="#6B5228"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B5228"/>
      <stop offset="0.5" stop-color="#A9884A"/>
      <stop offset="1" stop-color="#6B5228"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D4B46A" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#D4B46A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#D4B46A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="100" cy="86" rx="96" ry="60" fill="url(#light)"/>
  <ellipse cx="100" cy="122" rx="66" ry="11" fill="#000" opacity="0.42"/>

  <!-- three coins, bottom first -->
  <g>
    <path d="M 48 104 A 42 16.8 0 0 0 132 104 L 132 112 A 42 16.8 0 0 1 48 112 Z" fill="url(#edge)"/>
    <path d="M 48 108 A 42 16.8 0 0 0 132 108" fill="none" stroke="#F7EBCB" stroke-opacity="0.28" stroke-width="4.4" stroke-dasharray="1.6 2.4"/>
    <ellipse cx="90" cy="104" rx="42" ry="16.8" fill="url(#face)"/>
  </g>
  <g>
    <path d="M 49.5 96 A 42 16.8 0 0 0 133.5 96 L 133.5 104 A 42 16.8 0 0 1 49.5 104 Z" fill="url(#edge)"/>
    <path d="M 49.5 100 A 42 16.8 0 0 0 133.5 100" fill="none" stroke="#F7EBCB" stroke-opacity="0.28" stroke-width="4.4" stroke-dasharray="1.6 2.4"/>
    <ellipse cx="91.5" cy="96" rx="42" ry="16.8" fill="url(#face)"/>
  </g>
  <g>
    <path d="M 48 88 A 42 16.8 0 0 0 132 88 L 132 96 A 42 16.8 0 0 1 48 96 Z" fill="url(#edge)"/>
    <path d="M 48 92 A 42 16.8 0 0 0 132 92" fill="none" stroke="#F7EBCB" stroke-opacity="0.28" stroke-width="4.4" stroke-dasharray="1.6 2.4"/>
    <ellipse cx="90" cy="88" rx="42" ry="16.8" fill="url(#face)"/>
    <ellipse cx="90" cy="88" rx="39.6" ry="15.7" fill="none" stroke="#FBF3DC" stroke-opacity="0.7" stroke-width="1.3"/>
    <ellipse cx="90" cy="88" rx="32" ry="12.8" fill="none" stroke="#6B5228" stroke-opacity="0.35" stroke-width="1"/>
    <!-- the mark, engraved -->
    <g transform="translate(90 89.4) scale(0.79 0.316) translate(-32 -32)" fill="#FBF3DC" opacity="0.55">
      <g transform="translate(5,0) skewX(-8)">
        <rect x="14" y="12" width="10" height="40" rx="3"/><rect x="14" y="12" width="34" height="10" rx="5"/>
        <rect x="14" y="27" width="26" height="10" rx="5"/><rect x="14" y="42" width="34" height="10" rx="5"/>
        <rect x="3" y="12" width="7" height="10" rx="5" opacity="0.45"/>
      </g>
    </g>
    <g transform="translate(90 88) scale(0.79 0.316) translate(-32 -32)" fill="#7B6132">
      <g transform="translate(5,0) skewX(-8)">
        <rect x="14" y="12" width="10" height="40" rx="3"/><rect x="14" y="12" width="34" height="10" rx="5"/>
        <rect x="14" y="27" width="26" height="10" rx="5"/><rect x="14" y="42" width="34" height="10" rx="5"/>
        <rect x="3" y="12" width="7" height="10" rx="5" opacity="0.45"/>
      </g>
    </g>
  </g>

  <!-- a coin leaning against the stack -->
  <g transform="rotate(-14 142 78)">
    <ellipse cx="128" cy="78" rx="15" ry="38.6" fill="url(#side)"/>
    <ellipse cx="142" cy="78" rx="15" ry="38.6" fill="url(#face)"/>
    <ellipse cx="142" cy="78" rx="13.4" ry="36.2" fill="none" stroke="#FBF3DC" stroke-opacity="0.8" stroke-width="1.2"/>
    <g transform="translate(142 78) scale(0.27 0.675) translate(-32 -32)" fill="#7B6132">
      <g transform="translate(5,0) skewX(-8)">
        <rect x="14" y="12" width="10" height="40" rx="3"/><rect x="14" y="12" width="34" height="10" rx="5"/>
        <rect x="14" y="27" width="26" height="10" rx="5"/><rect x="14" y="42" width="34" height="10" rx="5"/>
      </g>
    </g>
  </g>
</svg>
