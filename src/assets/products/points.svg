<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="נקודות משחק">
  <!-- EASYCOINS product art: game points. Three machined octagonal tokens in
       the steel material of the coin packs, the top one struck with a star in
       champagne gold. Same geometry, materials and stage light as the pack
       artwork the app renders inline, so the shelf reads as one family.
       Original design; no publisher property is depicted. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#E6ECF4"/>
      <stop offset="0.55" stop-color="#9AA7B8"/>
      <stop offset="1" stop-color="#5C6879"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C6879"/>
      <stop offset="1" stop-color="#2B333F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EBCB"/>
      <stop offset="0.45" stop-color="#D4B46A"/>
      <stop offset="1" stop-color="#A9884A"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="60%" r="55%">
      <stop offset="0" stop-color="#6E93FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6E93FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="100" cy="96" rx="82" ry="40" fill="url(#light)"/>
  <ellipse cx="100" cy="124" rx="52" ry="7" fill="#000" opacity="0.45"/>

  <!-- bottom token -->
  <g transform="translate(100 106) scale(1 0.55)">
    <path transform="translate(0 16)" fill="url(#edge)" d="M40.6,16.8 L16.8,40.6 L-16.8,40.6 L-40.6,16.8 L-40.6,-16.8 L-16.8,-40.6 L16.8,-40.6 L40.6,-16.8 Z"/>
    <path fill="url(#face)" d="M40.6,16.8 L16.8,40.6 L-16.8,40.6 L-40.6,16.8 L-40.6,-16.8 L-16.8,-40.6 L16.8,-40.6 L40.6,-16.8 Z"/>
  </g>
  <!-- middle token -->
  <g transform="translate(100 92) scale(1 0.55)">
    <path transform="translate(0 16)" fill="url(#edge)" d="M40.6,16.8 L16.8,40.6 L-16.8,40.6 L-40.6,16.8 L-40.6,-16.8 L-16.8,-40.6 L16.8,-40.6 L40.6,-16.8 Z"/>
    <path fill="url(#face)" d="M40.6,16.8 L16.8,40.6 L-16.8,40.6 L-40.6,16.8 L-40.6,-16.8 L-16.8,-40.6 L16.8,-40.6 L40.6,-16.8 Z"/>
  </g>
  <!-- top token, struck -->
  <g transform="translate(100 78) scale(1 0.55)">
    <path transform="translate(0 16)" fill="url(#edge)" d="M40.6,16.8 L16.8,40.6 L-16.8,40.6 L-40.6,16.8 L-40.6,-16.8 L-16.8,-40.6 L16.8,-40.6 L40.6,-16.8 Z"/>
    <path fill="url(#face)" d="M40.6,16.8 L16.8,40.6 L-16.8,40.6 L-40.6,16.8 L-40.6,-16.8 L-16.8,-40.6 L16.8,-40.6 L40.6,-16.8 Z"/>
    <path fill="none" stroke="#2B333F" stroke-opacity="0.55" stroke-width="2" d="M31.4,13 L13,31.4 L-13,31.4 L-31.4,13 L-31.4,-13 L-13,-31.4 L13,-31.4 L31.4,-13 Z"/>
    <path fill="url(#gloss)" d="M40.6,16.8 L16.8,40.6 L-16.8,40.6 L-40.6,16.8 L-40.6,-16.8 L-16.8,-40.6 L16.8,-40.6 L40.6,-16.8 Z" opacity="0.5"/>
  </g>
  <!-- the star, drawn upright over the top face -->
  <g transform="translate(100 78) scale(1.15 0.75)">
    <path fill="#2B333F" opacity="0.5" transform="translate(0 2.5)" d="M0,-14 L3.5,-4.9 L13.3,-4.3 L5.7,1.9 L8.2,11.3 L0,6 L-8.2,11.3 L-5.7,1.9 L-13.3,-4.3 L-3.5,-4.9 Z"/>
    <path fill="url(#gold)" d="M0,-14 L3.5,-4.9 L13.3,-4.3 L5.7,1.9 L8.2,11.3 L0,6 L-8.2,11.3 L-5.7,1.9 L-13.3,-4.3 L-3.5,-4.9 Z"/>
  </g>
</svg>
